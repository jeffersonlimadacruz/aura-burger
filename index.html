<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Burger | Cardápio Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .custom-shadow { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-[#FBF4E0] text-[#12304A] font-sans">

    <!-- Header -->
    <header class="bg-[#12304A] text-white p-6 text-center">
        <h1 class="text-3xl font-bold">Aura Burger</h1>
        <p class="text-[#F0A81C] italic mt-2">Sabor artesanal feito com boa energia</p>
    </header>

    <!-- App Container -->
    <main class="max-w-2xl mx-auto p-4">
        <div id="products-list" class="grid gap-4 mt-6">
            <!-- Produtos serão carregados aqui -->
            <p class="text-center animate-pulse">Carregando lanches...</p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center p-6 mt-10 border-t border-[#2C8CC4]">
        <button onclick="openAdmin()" class="text-sm underline hover:text-[#2C8CC4]">🔒 Área Admin</button>
    </footer>

    <script>
        // CONFIGURAÇÃO SUPABASE
        const SUPABASE_URL = "https://auvltcwshpvknhhvmwxt.supabase.co";
        const SUPABASE_KEY = "sb_publishable_cisP6qn5JU3h6rRccnDdAA_SuC2Moy3";
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // CARREGAR PRODUTOS
        async function loadProducts() {
            const { data, error } = await supabase.from('products').select('*');
            if (error) {
                console.error("Erro ao buscar produtos:", error);
                document.getElementById('products-list').innerHTML = "Erro ao carregar cardápio.";
                return;
            }

            const container = document.getElementById('products-list');
            container.innerHTML = data.map(p => `
                <div class="bg-white p-4 rounded-lg shadow-sm border border-[#2C8CC4] flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-lg">${p.name}</h3>
                        <p class="text-sm text-gray-600">${p.description}</p>
                        <span class="text-[#F0A81C] font-bold mt-2 block">R$ ${p.price.toFixed(2)}</span>
                    </div>
                    <button onclick="addToCart('${p.id}')" class="bg-[#0E4A66] text-white px-4 py-2 rounded-full text-sm">Adicionar</button>
                </div>
            `).join('');
        }

        function openAdmin() {
            const pass = prompt("Digite a senha do painel:");
            if (pass === "1234") {
                alert("Acesso liberado! (Em breve: Painel Completo)");
                // Aqui você abrirá o painel administrativo
            } else {
                alert("Senha incorreta.");
            }
        }

        // Iniciar
        loadProducts();

        // Monitorar Pedidos em Tempo Real
        supabase.channel('orders')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, payload => {
                console.log('Novo pedido recebido!', payload.new);
                alert('🍔 NOVO PEDIDO CHEGOU! Veja no seu painel.');
            })
            .subscribe();

    </script>
</body>
</html>
